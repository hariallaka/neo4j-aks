# Mirrors kubectl_manifest.neo4j_virtualservice in terraform/ingress.tf.
# destination.host is the neo4j chart's own shared external Service
# ("<neo4j.name>-lb-neo4j"), matching neo4j-values.yaml's neo4j.name
# ("neo4j-aks-local").
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: neo4j-aks-local-vs
  namespace: neo4j
spec:
  hosts:
    - "*"
  gateways:
    - neo4j-aks-local-gateway
  tcp:
    - match:
        - port: 7687
      route:
        - destination:
            host: neo4j-aks-local-lb-neo4j.neo4j.svc.cluster.local
            port:
              number: 7687
    - match:
        - port: 7474
      route:
        - destination:
            host: neo4j-aks-local-lb-neo4j.neo4j.svc.cluster.local
            port:
              number: 7474
