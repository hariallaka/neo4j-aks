# Mirrors kubectl_manifest.neo4j_gateway in terraform/ingress.tf: plain TCP
# passthrough, no HTTP/WebSocket tunneling, no chart-managed backend pod.
#
# selector matches Istio's own default ingress gateway label
# (istio_ingress_gateway_selector's default in variables.tf) -- if you
# installed Istio locally with `istioctl install --set profile=demo`, this
# matches its gateway out of the box.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: neo4j-aks-local-gateway
  namespace: neo4j
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 7687
        name: tcp-bolt
        protocol: TCP
      hosts:
        - "*"
    - port:
        number: 7474
        name: tcp-http
        protocol: TCP
      hosts:
        - "*"
